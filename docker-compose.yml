services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-statintel}
      POSTGRES_USER: ${POSTGRES_USER:-statintel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-password}
    volumes:
      - statintel_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-statintel} -d ${POSTGRES_DB:-statintel}"]
      interval: 5s
      timeout: 3s
      retries: 20
  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-statintel}:${POSTGRES_PASSWORD:-change-this-password}@db:5432/${POSTGRES_DB:-statintel}
      JWT_SECRET: ${JWT_SECRET:-replace-with-a-long-random-secret-before-deployment}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-ChangeMe-Now-123!}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8000}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  statintel_db:
